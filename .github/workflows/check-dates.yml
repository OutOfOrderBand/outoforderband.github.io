name: Check Dates and Notify

on:
  schedule:
    - cron: '40 20 * * *' # daily at 19:35 UTC
  push:
    branches: [ main ]

jobs:
  check-dates:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: npm ci
        working-directory: .

      - name: Run compare script
        id: compare
        shell: bash
        run: node .github/scripts/compareDates.js

      - name: Show diff in summary
        run: |
          echo "### Dates checked at $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat diff.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Commit updated data.json if changed
        if: steps.compare.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          git commit -m "Update normalized data.json from compareDates.js" || echo "no changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send email via SendGrid if changed
        if: steps.compare.outputs.changed == 'true'
        shell: bash
        run: |
          DIFF_JSON=$(cat diff.json)

          # Build HTML in bash instead of jq
          HTML="<h2 style='font-family:Arial; color:#333;'>Band Member Unavailable Date Changes</h2>"
          HTML+="<table style='border-collapse:collapse; width:100%; font-family:Arial;'>"

          # Loop through JSON using jq
          for member in $(echo "$DIFF_JSON" | jq -r 'keys[]'); do
            HTML+="<tr style='background:#f0f0f0;'>
                    <td colspan='3' style='padding:10px; font-size:16px; font-weight:bold; border:1px solid #ccc;'>$member</td>
                  </tr>"

            # Added dates
            for d in $(echo "$DIFF_JSON" | jq -r --arg m "$member" '.[$m].added[]?'); do
              HTML+="<tr>
                      <td style='padding:8px; border:1px solid #ccc; width:120px;'>
                        <span style='color:green; font-weight:bold;'>Added</span>
                      </td>
                      <td style='padding:8px; border:1px solid #ccc;'>$d</td>
                      <td style='padding:8px; border:1px solid #ccc; color:green;'>✔️</td>
                    </tr>"
            done

            # Removed dates
            for d in $(echo "$DIFF_JSON" | jq -r --arg m "$member" '.[$m].removed[]?'); do
              HTML+="<tr>
                      <td style='padding:8px; border:1px solid #ccc; width:120px;'>
                        <span style='color:red; font-weight:bold;'>Removed</span>
                      </td>
                      <td style='padding:8px; border:1px solid #ccc;'>$d</td>
                      <td style='padding:8px; border:1px solid #ccc; color:red;'>❌</td>
                    </tr>"
            done
          done

          HTML+="</table>"

          SUBJECT="Band Member Unavailable Date Changes"

          curl -s --request POST \
            --url https://api.sendgrid.com/v3/mail/send \
            --header "Authorization: Bearer $SENDGRID_API_KEY" \
            --header 'Content-Type: application/json' \
            --data "$(jq -n --arg subj "$SUBJECT" --arg html "$HTML" --arg to "$ALERT_TO" '
              {
                personalizations: [{ to: [{ email: $to }] }],
                from: { email: "hi@normansolutions.co.uk" },
                subject: $subj,
                content: [{ type: "text/html", value: $html }]
              }
            ')"
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          ALERT_TO: ${{ secrets.ALERT_TO }}

