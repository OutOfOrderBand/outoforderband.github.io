name: Check Dates and Notify

on:
  schedule:
    - cron: '40 20 * * *' # daily at 19:35 UTC
  push:
    branches: [ main ]

jobs:
  check-dates:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: npm ci
        working-directory: .

      - name: Run compare script
        id: compare
        run: |
          node .github/scripts/compareDates.js

      - name: Show diff in summary
        run: |
          echo "### Dates checked at $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat diff.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Commit updated data.json if changed
        if: steps.compare.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          git commit -m "Update normalized data.json from compareDates.js" || echo "no changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send email via SendGrid if changed
        if: steps.compare.outputs.changed == 'true'
        run: |
          DIFF_JSON=$(cat diff.json)

          HTML=$(jq -n --argjson diff "$DIFF_JSON" '
            "<h2 style=\"font-family:Arial;\">Gig Date Changes</h2>" +
            (if ($diff.added | length) > 0 then
              "<h3 style=\"color:green;\">Added</h3><ul>" +
              (($diff.added | map("<li><strong>\(.date)</strong> – \(.venue)</li>")) | join("")) +
              "</ul>"
            else "" end) +
            (if ($diff.removed | length) > 0 then
              "<h3 style=\"color:red;\">Removed</h3><ul>" +
              (($diff.removed | map("<li><strong>\(.date)</strong> – \(.venue)</li>")) | join("")) +
              "</ul>"
            else "" end) +
            (if ($diff.changed | length) > 0 then
              "<h3 style=\"color:orange;\">Changed</h3><ul>" +
              (($diff.changed | map("<li><strong>\(.key)</strong>: \(.old) → \(.new)</li>")) | join("")) +
              "</ul>"
            else "" end)
          ')

          SUBJECT="Gig dates updated"

          curl -s --request POST \
            --url https://api.sendgrid.com/v3/mail/send \
            --header "Authorization: Bearer $SENDGRID_API_KEY" \
            --header 'Content-Type: application/json' \
            --data "$(jq -n --arg subj "$SUBJECT" --arg html "$HTML" --arg to "$ALERT_TO" '
              {
                personalizations: [{ to: [{ email: $to }] }],
                from: { email: "hi@normansolutions.co.uk" },
                subject: $subj,
                content: [{ type: "text/html", value: $html }]
              }
            ')"
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
